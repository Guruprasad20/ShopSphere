{% extends "base.html" %}
{% block title %}Create Account — ShopSphere{% endblock %}
{% block content %}
<div class="auth-wrap"><div class="auth-card wide"><span class="eyebrow">GET STARTED</span><h1>Create your account</h1><p>Join ShopSphere and start building your order history.</p>
<form method="post">{% csrf_token %}{% for field in form %}<label>{{ field.label }}{{ field }}{% if field.help_text %}<small>{{ field.help_text|safe }}</small>{% endif %}{% for error in field.errors %}<small class="error">{{ error }}</small>{% endfor %}</label>{% endfor %}<button class="btn btn-primary btn-full">Create account</button></form>
<p class="auth-foot">Already registered? <a href="{% url 'login' %}">Sign in</a></p></div></div>
{% endblock %}
