{% extends "base.html" %}
{% block title %}Login — ShopSphere{% endblock %}
{% block content %}
<div class="auth-wrap"><div class="auth-card"><span class="eyebrow">WELCOME BACK</span><h1>Sign in</h1><p>Continue to your ShopSphere account.</p>
<form method="post">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<label>{{ field.label }}{{ field }}{% for error in field.errors %}<small class="error">{{ error }}</small>{% endfor %}</label>{% endfor %}<button class="btn btn-primary btn-full">Sign in</button></form>
<p class="auth-foot">New here? <a href="{% url 'register' %}">Create an account</a></p></div></div>
{% endblock %}
